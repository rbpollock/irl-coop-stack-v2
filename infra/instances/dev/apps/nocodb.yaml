# NocoDB — spreadsheet layer over the user-scoped mirrors/views.
name: nocodb
pillar: storage
type: image
image: irlcoop/nocodb-gate-sso:2026.08.8
env:
  # query-string format (maintainer-confirmed); alphanumeric password —
  # NocoDB's URL parser is fragile with special chars in the standard form
  NC_DB: pg://postgres:5432?u=nocodb&p=${SECRET:postgres.nocodb}&d=nocodb
  # Gate SSO: auto-login from the oauth2-proxy identity header (patched
  # build). v7 passes the identity as X-Forwarded-Email/User (NOT
  # X-Auth-Request-Email — that's the response-side auth_request header).
  NC_GATE_SSO_EMAIL_HEADER: x-forwarded-email
  # allow external sources to connect to the local projection (Citus on the
  # docker network) — otherwise SSRF protection blocks internal hosts.
  NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
  # disable the in-app support chat (Chatwoot) widget — we don't run Chatwoot,
  # and the empty CHATWOOT_IDENTITY_KEY otherwise produces an "iframe refusal"
  # console error on every page load.
  NC_DISABLE_SUPPORT_CHAT: "true"
depends_on:
  - postgres
sidecars:
  nocodb-gate:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    # discovery-502 quirk: oauth2-proxy does OIDC discovery once, no retry (same
    # as Synapse) — the restart policy self-heals a coop-api-restart window.
    command:
      - --provider=oidc
      # the fleet session gateway — the coop_session cookie makes authorize
      # instant (no Keycloak page when the dashboard session exists)
      - --oidc-issuer-url=https://api.${DOMAIN}
      - --client-id=nocodb-gate
      - --client-secret=nocodb-gate-secret
      - --redirect-url=https://nocodb.${DOMAIN}/oauth2/callback
      - --email-domain=*
      - --upstream=http://nocodb:8080
      - --http-address=0.0.0.0:4180
      - --cookie-secret=irlcoop-nocodb-gate-dev-sec-1234
      - --cookie-name=_irlnocodb
      - --cookie-secure=false
      - --skip-provider-button=true
      # PWA pre-login files: the browser's first-load manifest/sw fetches are
      # no-credentials; the gate 302s them to authorize and the cross-origin
      # redirect is CORS-blocked (manifest never installs). Data paths (/api/*,
      # /) stay gated.
      - --skip-auth-route=/manifest.webmanifest
      - --skip-auth-route=/sw.js
      - --skip-auth-route=/favicon.ico
      - --skip-auth-route=/robots.txt
      # inject the identity to NocoDB's Gate SSO (v7: pass-user-headers sends
      # X-Forwarded-Email/X-Forwarded-User to the upstream)
      - --pass-user-headers=true
    ports:
      # NOT loopback-bound: the traefik edge reaches the gate via the docker
      # gateway (172.17.0.1:8082) — restrict at the firewall in prod.
      - "8082:4180"
    depends_on:
      - nocodb
proxy:
  hostname: nocodb.${DOMAIN}
  port: 8082
  description: the oauth2-proxy gate (identity-gated)
nav:
  label: Databases
  icon: Database
  section: Coop
data:
  # reads per-user views over plane-db (infra/compose/storage/scripts/plane_user_view.sql)
  consumes_views: true
  oidc: gate            # Tier 2: Keycloak forward-auth (native OIDC is paid)
dev:
  volumes:
    # Replace NocoDB's workbox PWA service worker with a neutralized no-op one.
    # The stock SW's NavigationRoute can serve a stale/corrupted cached "ok" for
    # "/", permanently hijacking the app (the app never loads, so the SW never
    # updates itself — the "just 'ok'" bug). This no-op SW clears every cache on
    # activation and declares no fetch listener, so the browser never routes
    # through a SW again. No NocoDB rebuild required; survives regeneration.
    - ./assets/nocodb/sw.js:/usr/src/app/docker/nc-gui/sw.js
