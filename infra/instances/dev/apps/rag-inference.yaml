# rag-inference — self-hosted CPU embedding + rerank server backing the RAG
# retrieval pipeline. Internal-only (no edge route): the RAG api/worker reach it
# over the host bridge (172.17.0.1:8001). Exposes the OpenAI-compatible
# /v1/embeddings and the RAG's /v1/rerank contract, gated by a Bearer key.
name: rag-inference
pillar: workflow
enabled: true
type: image
image: irlcoop/embed-rerank:0.1.0
ports:
  - "8001:8000"
env:
  EMBED_MODEL: "BAAI/bge-large-en-v1.5"
  # Reranker = bge-reranker-v2-m3, chosen by MEASUREMENT not by size. On a
  # 21-item labelled query set (infra/scripts/rag-eval) it scored hit@1 71.4% /
  # MRR 0.766; the smaller bge-reranker-base scored 42.9% / 0.584 — WORSE than
  # turning reranking off entirely (47.6% / 0.630) while still costing 5x the
  # latency. The cheap model is a false economy on this corpus: do NOT swap it
  # back down for speed. Speed comes from the candidate pool instead (see
  # RERANK_TOP_N in rag-api.yaml).
  RERANK_MODEL: "BAAI/bge-reranker-v2-m3"
  RERANK_MAX_LENGTH: "256"
  INFERENCE_API_KEY: "${SECRET:rag.inference}"
  # Use every core: this box is 8-core and the reload/thrash defaults leave
  # most of it idle during a rerank batch.
  OMP_NUM_THREADS: "8"
  MKL_NUM_THREADS: "8"
  TOKENIZERS_PARALLELISM: "false"
volumes:
  - rag_hf_cache:/root/.cache/huggingface
named_volumes:
  rag_hf_cache: {}
restart: unless-stopped
healthcheck:
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
  interval: 30s
  timeout: 10s
  retries: 5
