# rag-worker — Celery ingest/index worker (PDF/Office parse → chunk → embed →
# PGroonga FTS). Populates the RAG knowledge base; embeds via the self-hosted
# inference server (rag-inference), files in the shared MinIO `rag` bucket.
name: rag-worker
pillar: workflow
enabled: true
type: image
image: irlcoop/rag-worker:0.1.0
restart: unless-stopped
depends_on:
  rag-migrate:
    condition: service_completed_successfully
env:
  DATABASE_URL: "postgresql://rag:${SECRET:postgres.rag}@172.17.0.1:5432/rag"
  CELERY_BROKER_URL: "redis://172.17.0.1:6379/2"
  CELERY_RESULT_BACKEND: "redis://172.17.0.1:6379/3"
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: "http://172.17.0.1:9000"
  MINIO_ACCESS_KEY: rag-s3
  MINIO_SECRET_KEY: "${SECRET:minio.rag-s3}"
  MINIO_BUCKET: rag
  MINIO_SECURE: "false"
  EMBEDDING_PROVIDER: self-hosted
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  EMBEDDING_DIMENSIONS: "1536"
  SELF_HOSTED_EMBEDDING_BASE_URL: "http://172.17.0.1:8001"
  SELF_HOSTED_EMBEDDING_API_KEY: "${SECRET:rag.inference}"
  SELF_HOSTED_EMBEDDING_TIMEOUT_SECONDS: "120"
  PDF_PARSER_PROVIDER: opendataloader
  DOCUMENT_SYNOPSIS_PROVIDER: deterministic
