# Formbricks — open-source surveys/forms (workflow pillar).
#
# 2026 architecture is multi-service: the web app (Next.js) + Cube (semantic
# analytics layer, REQUIRED for the web app to start) + a one-shot Prisma
# migration. The optional Hub (template/insights sharing) is NOT deployed.
# Uses the shared Citus Postgres (db `formbricks`, role `formbricks`, pgvector
# available via the citus `-vector` image) and the shared Redis (db index 1).
#
# Gate-SSO (like nocodb/webstudio): Formbricks OIDC SSO is Enterprise-licensed
# (/ee) and phone-homes to ee.formbricks.com, so the ADMIN domain (forms.*) sits
# behind an oauth2-proxy gate → coop-api OIDC → x-forwarded-email → auto-login
# (the irlcoop/formbricks-gate-sso image patches the middleware + a gate-sso
# route). Survey RESPONDENTS stay anonymous on the PUBLIC_URL domain (surveys.*),
# which is NOT gated.
name: formbricks
pillar: workflow
type: image
image: irlcoop/formbricks-gate-sso:5.4.0-irl.7
env:
  WEBAPP_URL: https://forms.${DOMAIN}
  # anonymous survey-respondent domain (NOT gated — the embed script + /s/* +
  # /api/v*/client/* live here; the admin domain above is the gated one)
  PUBLIC_URL: https://surveys.${DOMAIN}
  # gate-SSO auto-login from the oauth2-proxy x-forwarded-email (opt-in)
  GATE_SSO_ENABLED: "1"
  NEXTAUTH_URL: https://forms.${DOMAIN}
  DATABASE_URL: postgresql://formbricks:${SECRET:postgres.formbricks}@172.17.0.1:5432/formbricks
  NEXTAUTH_SECRET: ${SECRET:formbricks.nextauth}
  ENCRYPTION_KEY: ${SECRET:formbricks.encryption}
  CRON_SECRET: ${SECRET:formbricks.cron}
  REDIS_URL: redis://172.17.0.1:6379/1
  CUBEJS_API_URL: http://formbricks-cube:4000
  CUBEJS_API_SECRET: ${SECRET:formbricks.cube}
  CUBEJS_JWT_ISSUER: formbricks-web
  CUBEJS_JWT_AUDIENCE: formbricks-cube
  # Hub (template/insights) — required by env validation in the 2026 build
  HUB_API_URL: http://formbricks-hub:8080
  HUB_API_KEY: ${SECRET:formbricks.hub}
  # SMTP via the coop-api relay (172.17.0.1:1025, LOGIN with the shared secret) —
  # the relay delivers through Stalwart XOAUTH2 (apps/coop-api/src/smtp-relay.ts).
  SMTP_HOST: 172.17.0.1
  SMTP_PORT: "1025"
  SMTP_USER: relay
  SMTP_PASSWORD: ${SECRET:smtp.relay}
  SMTP_SECURE_ENABLED: "0"
  SMTP_AUTHENTICATED: "1"
  SMTP_REJECT_UNAUTHORIZED_TLS: "0"
  MAIL_FROM_NAME: irl.coop
  MAIL_FROM: notifications@irl.coop
  # SSO handles auth, so Formbricks-side email verification/password-reset stay off
  EMAIL_VERIFICATION_DISABLED: "1"
  PASSWORD_RESET_DISABLED: "1"
  # self-hosted: accounts are invite-only
  INVITE_DISABLED: "0"
  # Survey file uploads → the coop MinIO (bucket formbricks, user formbricks-s3,
  # provisioned by formbricks-minio-init in minio.yaml). Path-style + the docker
  # gateway IP (cross-pillar, same pattern as matrix → 172.17.0.1:9000).
  S3_ACCESS_KEY: formbricks-s3
  S3_SECRET_KEY: ${SECRET:minio.formbricks-s3}
  S3_REGION: us-east-1
  S3_BUCKET_NAME: formbricks
  S3_ENDPOINT_URL: http://172.17.0.1:9000
  S3_FORCE_PATH_STYLE: "1"
  # migrations run in the formbricks-migrate sidecar (ordering vs cube)
  SKIP_STARTUP_MIGRATION: "true"
ports:
  - "3008:3000"
restart: always
depends_on:
  formbricks-migrate:
    condition: service_completed_successfully
  formbricks-cube:
    condition: service_healthy
healthcheck:
  # NB: hitting "/" is WRONG — formbricks 307s it to the ABSOLUTE external
  # https://forms.irl.coop/auth/login, so an in-container fetch chases the
  # public edge and never sees 2xx (container sat "unhealthy" for days while
  # the app was fine). /auth/login answers 200 internally, no redirect.
  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/auth/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s
proxy:
  - hostname: forms.${DOMAIN}
    port: 8095
    description: Formbricks admin (coop-identity gated)
  - hostname: surveys.${DOMAIN}
    port: 3008
    description: Formbricks public survey domain (anonymous respondents)
nav:
  label: Surveys
  icon: ClipboardList
  section: Coop
sidecars:
  formbricks-gate:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    # discovery-502 quirk: oauth2-proxy does OIDC discovery once, no retry (same
    # as Synapse) — the restart policy self-heals a coop-api-restart window.
    command:
      - --provider=oidc
      # the fleet session gateway — the coop_session cookie makes authorize
      # instant (no Keycloak page when the dashboard session exists)
      - --oidc-issuer-url=https://api.${DOMAIN}
      - --client-id=formbricks-gate
      - --client-secret=formbricks-gate-secret
      - --redirect-url=https://forms.${DOMAIN}/oauth2/callback
      - --email-domain=*
      - --upstream=http://formbricks:3000
      - --http-address=0.0.0.0:4180
      - --cookie-secret=irlcoop-formbricks-gate-sec-1234
      - --cookie-name=_irlformbricks
      - --cookie-secure=false
      - --skip-provider-button=true
      # inject the identity (X-Forwarded-Email/User/Groups) for the app's gate-SSO
      - --pass-user-headers=true
      # the coop JWT's `groups` claim (JSON string of {slug,name,roles}) → the
      # x-forwarded-groups header the gate-SSO route parses for group→team mapping
      - --oidc-groups-claim=groups
      # the coop-api id_token is a large JWT; the default cookie session store
      # blows past the browser 4KB cookie limit and the browser truncates it
      # ("cookie signature not valid" → redirect loop). Store the session in
      # Redis (tiny cookie = session id). DB 2 = the formbricks app uses DB 1.
      - --session-store-type=redis
      - --redis-connection-url=redis://172.17.0.1:6379/2
    ports:
      # NOT loopback-bound: the traefik edge reaches the gate via the docker
      # gateway (172.17.0.1:8095) — restrict at the firewall in prod.
      - "8095:4180"
    depends_on:
      - formbricks
  formbricks-db-setup:
    image: postgres:15-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql "postgresql://postgres:${SECRET:postgres.irlcoop}@172.17.0.1:5432/postgres" -tAc "SELECT 1 FROM pg_roles WHERE rolname='formbricks'" | grep -q 1 || psql "postgresql://postgres:${SECRET:postgres.irlcoop}@172.17.0.1:5432/postgres" -c "CREATE ROLE formbricks LOGIN PASSWORD '${SECRET:postgres.formbricks}'"
        psql "postgresql://postgres:${SECRET:postgres.irlcoop}@172.17.0.1:5432/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='formbricks'" | grep -q 1 || psql "postgresql://postgres:${SECRET:postgres.irlcoop}@172.17.0.1:5432/postgres" -c "CREATE DATABASE formbricks OWNER formbricks"
        psql "postgresql://postgres:${SECRET:postgres.irlcoop}@172.17.0.1:5432/formbricks" -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
        echo 'formbricks DB ready.'
  formbricks-migrate:
    image: ghcr.io/formbricks/formbricks:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - node packages/database/dist/scripts/apply-migrations.js
    environment:
      DATABASE_URL: postgresql://formbricks:${SECRET:postgres.formbricks}@172.17.0.1:5432/formbricks
    depends_on:
      formbricks-db-setup:
        condition: service_completed_successfully
  formbricks-cube:
    image: cubejs/cube:v1.6.6
    restart: always
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: 172.17.0.1
      CUBEJS_DB_NAME: formbricks
      CUBEJS_DB_USER: formbricks
      CUBEJS_DB_PASS: ${SECRET:postgres.formbricks}
      CUBEJS_DB_PORT: "5432"
      CUBEJS_API_SECRET: ${SECRET:formbricks.cube}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_EXTERNAL_DEFAULT: "false"
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    dev:
      volumes:
        - ./assets/formbricks/cube/cube.js:/cube/conf/cube.js:ro
        - ./assets/formbricks/cube/schema:/cube/conf/model:ro
  formbricks-hub-migrate:
    image: ghcr.io/formbricks/hub:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - 'goose -dir /app/migrations postgres "postgresql://formbricks:${SECRET:postgres.formbricks}@172.17.0.1:5432/formbricks?sslmode=disable" up && river migrate-up --database-url "postgresql://formbricks:${SECRET:postgres.formbricks}@172.17.0.1:5432/formbricks?sslmode=disable"'
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
  formbricks-hub:
    image: ghcr.io/formbricks/hub:latest
    restart: always
    environment:
      API_KEY: ${SECRET:formbricks.hub}
      DATABASE_URL: postgresql://formbricks:${SECRET:postgres.formbricks}@172.17.0.1:5432/formbricks?sslmode=disable
      HUB_INTERNAL_API_TOKEN: ${SECRET:formbricks.hubinternal}
    depends_on:
      formbricks-hub-migrate:
        condition: service_completed_successfully
