# Temporal — durable workflows (workflow pillar).
name: temporal
pillar: workflow
type: image
image: temporalio/server:1.24.0
env:
  DB: postgresql
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PWD: ${SECRET:postgres.temporal}
  POSTGRES_SEEDS: postgres   # connect to Citus (storage pillar, shared network)
