# Keycloak — the co-op's single identity (Pillar 1 of the federation layer).
name: keycloak
pillar: authentication
type: image
image: quay.io/keycloak/keycloak:25.0.6
# 25.0.6 — REQUIRED for passkey login: the WebAuthn authenticator's
# `authenticate()` gained the ID-less (null-user) guard in 25 (24.x NPEs on
# the login-page GET; the conditional-user-configured condition still NPEs on
# the webauthn's configuredFor in every version — the browser-passkey flow
# therefore uses the FLAT webauthn execution, no condition; see
# infra/scripts/kc-webauthn-config.py)
command: start-dev
ports:
  - "8081:8081"
env:
  KC_DB: postgres
  # Shared Citus coordinator (storage pillar) — the canonical identity store
  # lives on the same Postgres 16 instance as irlcoop/nocodb/matrix/stalwart,
  # in its own `keycloak` database + `keycloak` role. Reachable via the docker
  # bridge gateway (172.17.0.1:5432), same as the edge proxy + other fleet apps.
  KC_DB_URL: jdbc:postgresql://172.17.0.1:5432/keycloak
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: ${SECRET:keycloak.db}
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: ${SECRET:keycloak.admin}
  # canonical identity URL: auth.irl.coop IS the realm issuer (edge = traefik);
  # xforwarded lets Keycloak trust the proxy for URL building.
  KC_HOSTNAME: auth.${DOMAIN}
  KC_PROXY_HEADERS: xforwarded
  KC_HTTP_PORT: "8081"
  # frame policy is governed by the realm CSP (frame-ancestors *.irl.coop);
  # the legacy X-Frame-Options would block the dashboard chat widget's SSO
  # iframe, so drop the header entirely
  KC_XFRAMEOPTIONS: "NONE"
dev:
  volumes:
    # Custom OIDC protocol mapper (coop-groups-mapper.jar): makes the `groups`
    # scope real by fetching a user's groups live from coop-api. Built from
    # ./assets/keycloak/mapper/ (build.sh); mounted so it survives a recreate.
    - "./assets/keycloak/coop-groups-mapper.jar:/opt/keycloak/providers/coop-groups-mapper.jar:ro"
proxy:
  hostname: auth.${DOMAIN}
  port: 8081
  description: the irl-coop realm + admin console
