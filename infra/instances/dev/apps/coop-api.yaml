# coop-api — the auth bridge (NextAuth custom provider -> Keycloak) + relayer.
# Runs as a HOST process (pnpm dev at apps/coop-api); the edge targets the
# docker gateway (172.17.0.1:3001) like the other host-bound routes.
name: coop-api
pillar: authentication
type: source
source: /home/service/development/irl-coop-stack-v2/apps/coop-api
web: https://api.${DOMAIN}
oidc:
  client_id: coop-api
  redirect: /api/auth/keycloak/callback
proxy:
  hostname: api.${DOMAIN}
  port: 3001
  description: coop-api auth bridge (host process)
nav:
  label: API
  icon: Braces
  section: Build
# Derived-key secrets consumed by the host process (docs module): the
# generator resolves these into out/<instance>/secrets.env, which the
# coop-api dev process sources at start. Keys match docs.ts env reads.
env:
  MINIO_ACCESS_KEY: docs-s3
  MINIO_SECRET_KEY: ${SECRET:minio.docs-s3}
  # Member-avatar store — dedicated `profiles` bucket + `profiles-s3` user
  # (provisioned by the profiles-minio-init sidecar in minio.yaml).
  MINIO_PROFILES_ACCESS_KEY: profiles-s3
  MINIO_PROFILES_SECRET_KEY: ${SECRET:minio.profiles-s3}
  MINIO_PROFILES_BUCKET: profiles
  ONLYOFFICE_JWT_SECRET: ${SECRET:onlyoffice.jwt}
  # HMAC secret for the short-lived content relay tokens (docs.sig).
  DOCS_SIG: ${SECRET:docs.sig}
  # HMAC secret for the file-panel share tokens (variant B, files.sig).
  FILES_SIG: ${SECRET:files.sig}
  E2E_PASSWORD: ${SECRET:keycloak.e2e-test}
  # Stalwart webhook bearer token (mail.received events -> event bus).
  STALWART_WEBHOOK: ${SECRET:stalwart.webhook}
  # Hi.Events → event bus: the bearer token its auto-provisioned webhooks present
  # (the app container gets the SAME derived value as COOP_EVENT_BUS_SECRET), and
  # the app's public URL for notification deep links.
  HI_EVENTS_WEBHOOK: ${SECRET:hi-events.webhook}
  HI_EVENTS_URL: https://events.${DOMAIN}
  # Digest sender account (notifications@irl.coop) — password for the SMTP
  # XOAUTH2 submission the Temporal digest workflow uses to mail digests.
  KEYCLOAK_NOTIFICATIONS: ${SECRET:keycloak.notifications}
  # SMTP relay (internal apps → Stalwart XOAUTH2) — the "coop-api SMTP passthrough".
  # Apps that only speak standard SMTP LOGIN (Formbricks) point their SMTP at
  # 172.17.0.1:1025 with these shared credentials. See src/smtp-relay.ts.
  SMTP_RELAY_PORT: "1025"
  SMTP_RELAY_USER: relay
  SMTP_RELAY_PASSWORD: ${SECRET:smtp.relay}
  SAFE_SINGLETON_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  SAFE_PROXY_FACTORY_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
  SAFE_BACKEND_SIGNER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  COOP_DB_HOST: 172.17.0.1
  COOP_DB_PORT: "5432"
  COOP_DB_USER: coop
  COOP_DB_PASSWORD: ${SECRET:postgres.coop}
  COOP_DB_NAME: irlcoop
  # coop_ops operator role (least-privilege; EXECUTE-only on the platform-admin
  # promotion functions) — password for the dedicated opsPool in db.ts.
  COOP_OPS: ${SECRET:coop.ops}
  # Postiz DB (the group→org projection target) — derived postiz role/password.
  POSTIZ_DB_HOST: 172.17.0.1
  POSTIZ_DB_PORT: "5432"
  POSTIZ_DB_USER: postiz
  POSTIZ_DB_PASSWORD: ${SECRET:postgres.postiz}
  POSTIZ_DB_NAME: postiz
  # FusionPBX system DB (telephony sip-config read): derived password replaces
  # the old hardcoded spike value in apps/coop-api/.env.
  FUSIONPBX_DB_HOST: 172.17.0.1
  FUSIONPBX_DB_PORT: "5432"
  FUSIONPBX_DB_USER: fusionpbx
  FUSIONPBX_DB_NAME: fusionpbx
  FUSIONPBX_DB_PASSWORD: ${SECRET:fusionpbx.db-password}
  # Shared bearer secret for the Keycloak `groups` protocol mapper: Keycloak
  # calls GET /api/internal/groups?sub=<sub> (CoopGroupsMapper SPI JAR) to
  # resolve a user's groups live from coop-api. Server-to-server only.
  KEYCLOAK_GROUPS_TOKEN: ${SECRET:keycloak.groups-token}

  # --- payment rails: coop-api holds the CONTRACT and the coop's POLICY, never a vendor SDK ---
  # The rail service (apps/peer_xyz_payments) owns the provider; this side owns the rules.
  # NOTE the naming: the URL and the id are neutral. The provider's name belongs in the
  # rail service, not in coop-api's configuration — otherwise "swap the provider" means
  # renaming config in the core.
  RAIL_URL: http://127.0.0.1:3010
  RAIL_ID: peer
  RAIL_AUTH_TOKEN: ${SECRET:payments.rail-token}
  # RULE 1 lives here now: the COOP decides where money goes, and the rail only executes.
  # Refuses if unset — and the rail independently refuses a call with no destination, because
  # the provider's own default is the merchant's wallet (verified by experiment 2026-09-13).
  PAYMENTS_DESTINATION: "0x7E11a683193830a7bc24E08029aF1AaFABB7EAEa"
  PAYMENTS_CHAIN_ID: "8453"
  PAYMENTS_CURRENCY: USDC
