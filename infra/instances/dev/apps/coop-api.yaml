# coop-api — the auth bridge (NextAuth custom provider -> Keycloak) + relayer.
# Runs as a HOST process (pnpm dev at apps/coop-api); the edge targets the
# docker gateway (172.17.0.1:3001) like the other host-bound routes.
name: coop-api
pillar: authentication
type: source
source: /home/service/development/irl-coop-stack-v2/apps/coop-api
web: https://api.${DOMAIN}
oidc:
  client_id: coop-api
  redirect: /api/auth/keycloak/callback
proxy:
  hostname: api.${DOMAIN}
  port: 3001
  description: coop-api auth bridge (host process)
nav:
  label: API
  icon: Braces
  section: Build
# Derived-key secrets consumed by the host process (docs module): the
# generator resolves these into out/<instance>/secrets.env, which the
# coop-api dev process sources at start. Keys match docs.ts env reads.
env:
  MINIO_ACCESS_KEY: docs-s3
  MINIO_SECRET_KEY: ${SECRET:minio.docs-s3}
  ONLYOFFICE_JWT_SECRET: ${SECRET:onlyoffice.jwt}
  # HMAC secret for the short-lived content relay tokens (docs.sig).
  DOCS_SIG: ${SECRET:docs.sig}
  # HMAC secret for the file-panel share tokens (variant B, files.sig).
  FILES_SIG: ${SECRET:files.sig}
  E2E_PASSWORD: ${SECRET:keycloak.e2e-test}
  # Stalwart webhook bearer token (mail.received events -> event bus).
  STALWART_WEBHOOK: ${SECRET:stalwart.webhook}
  # Digest sender account (notifications@irl.coop) — password for the SMTP
  # XOAUTH2 submission the Temporal digest workflow uses to mail digests.
  KEYCLOAK_NOTIFICATIONS: ${SECRET:keycloak.notifications}
  SAFE_SINGLETON_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  SAFE_PROXY_FACTORY_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
  SAFE_BACKEND_SIGNER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  COOP_DB_HOST: 172.17.0.1
  COOP_DB_PORT: "5432"
  COOP_DB_USER: coop
  COOP_DB_PASSWORD: ${SECRET:postgres.coop}
  COOP_DB_NAME: irlcoop
  # Postiz DB (the group→org projection target) — derived postiz role/password.
  POSTIZ_DB_HOST: 172.17.0.1
  POSTIZ_DB_PORT: "5432"
  POSTIZ_DB_USER: postiz
  POSTIZ_DB_PASSWORD: ${SECRET:postgres.postiz}
  POSTIZ_DB_NAME: postiz
