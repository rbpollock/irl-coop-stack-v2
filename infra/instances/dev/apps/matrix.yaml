# Matrix — the coop's private chat (Synapse homeserver).
# Federation DISABLED (Robbie): LAN/coop-internal only — no 8448 route, no
# .well-known/matrix/server. Auth = the realm's OIDC via Synapse's built-in
# OIDC provider (the `matrix` client below); state = the shared Citus
# postgres; media = the shared MinIO. The full homeserver.yaml (OIDC claim
# mapping, S3 media provider, coturn TURN, listeners, registration off)
# lives in ./config/matrix/ and is mounted read-only — this spec declares the
# service, the edge route and the client.
name: matrix
pillar: communication
type: image
# irlcoop/synapse-s3 = stock Synapse + the S3 media provider (shared MinIO)
image: irlcoop/synapse-s3:v1.118.0
ports:
  - "8008:8008"
env:
  SYNAPSE_SERVER_NAME: matrix.${DOMAIN}
  SYNAPSE_REPORT_STATS: "no"
  # the mounted homeserver.yaml (./config/matrix, dev volume) — the image's
  # default path is /data/homeserver.yaml, so point it at the mount
  SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
  # shared Citus postgres — provisioned role `matrix` + db `matrix`
  # (consumed by the mounted homeserver.yaml; recorded here as the declarative fact)
  SYNAPSE_POSTGRES_HOST: 172.17.0.1
  SYNAPSE_POSTGRES_PORT: "5432"
  SYNAPSE_POSTGRES_DB: matrix
  SYNAPSE_POSTGRES_USER: matrix
  SYNAPSE_POSTGRES_PASSWORD: ${SECRET:postgres.matrix}
  # shared MinIO media store — provisioned bucket `matrix-media`, user `matrix-s3`
  SYNAPSE_MEDIA_S3_BUCKET: matrix-media
  SYNAPSE_MEDIA_S3_ENDPOINT: http://172.17.0.1:9000
  SYNAPSE_MEDIA_S3_SECRET: ${SECRET:minio.matrix-s3}
  # OIDC client secret for Keycloak registration
  SYNAPSE_OIDC_CLIENT_SECRET: ${SECRET:oidc.matrix}
  # TURN shared secret for coturn REST auth
  SYNAPSE_TURN_SHARED_SECRET: ${SECRET:coturn.shared-secret}
  # Matrix appservice tokens (coop-api metadata observer) — derived, shared with
  # coop-api via secrets.env (MATRIX_AS_TOKEN / MATRIX_HS_TOKEN)
  SYNAPSE_AS_TOKEN: ${SECRET:matrix.as-token}
  SYNAPSE_HS_TOKEN: ${SECRET:matrix.hs-token}
volumes:
  - /opt/app/communication/data/matrix:/data
dev:
  volumes:
    - ./data/matrix:/data
    - ./../../out/dev/config/matrix:/config:ro
proxy:
  hostname: matrix.${DOMAIN}
  port: 8008
  description: Synapse client-server API (federation disabled)
  # Synapse hardcodes Content-Security-Policy: frame-ancestors 'none'; the
  # dashboard iframes Element, whose OIDC SSO redirects through this origin —
  # override to allow the dashboard + Element to frame it.
  headers:
    Content-Security-Policy: "frame-ancestors 'self' https://${DOMAIN} https://element.${DOMAIN}"
oidc:
  client_id: matrix
  redirect: /_synapse/client/oidc/callback
  public: false
web: https://matrix.${DOMAIN}
