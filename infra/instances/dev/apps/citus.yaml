# Main Postgres — Citus, the canonical user-scoped store (storage pillar).
name: citus
pillar: storage
service_name: postgres
type: image
image: irlcoop/postgres-citus:12.1-vector-postgis-pgroonga
env:
  POSTGRES_PASSWORD: ${SECRET:postgres.irlcoop}
volumes:
  - /opt/app/storage/data/postgres:/var/lib/postgresql/data
# dev override (generator emits docker-compose.override.yml when
# instance.yaml has dev_overrides: true)
dev:
  ports:
    - "0.0.0.0:5432:5432"   # fleet containers reach it via 172.17.0.1:5432 (bridge gateway)
  volumes:
    - ./data/postgres:/var/lib/postgresql/data
data:
  scoped_by: sub          # per-user tables distributed on the realm subject
