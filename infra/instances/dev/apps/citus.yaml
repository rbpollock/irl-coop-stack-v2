# Main Postgres — Citus, the canonical user-scoped store (storage pillar).
name: citus
pillar: storage
service_name: postgres
type: image
image: irlcoop/postgres-citus:12.1-vector-postgis-pgroonga
env:
  POSTGRES_PASSWORD: ${SECRET:postgres.irlcoop}
  # NOTE: max_connections=100 (postgresql.conf) is shared by temporal (25+), matrix,
  # formbricks, postiz, stalwart, litefarm, keycloak, hievents, rag, plane, webstudio,
  # AND NocoDB's one-pool-per-external-source (one base per group → ~18 sources).
  # The 53300 "reserved for SUPERUSER" exhaustion is fixed at the NocoDB side via
  # NC_DB_POOL_MAX=2 (see nocodb.yaml), which bounds NocoDB's worst case to ~36 conns.
  # If fleet headroom is ever needed, raise via `command: postgres -c max_connections=200`
  # (requires a full-instance restart). The stock entrypoint does NOT read a
  # POSTGRES_MAX_CONNECTIONS env var.
volumes:
  - /opt/app/storage/data/postgres:/var/lib/postgresql/data
# dev override (generator emits docker-compose.override.yml when
# instance.yaml has dev_overrides: true)
dev:
  ports:
    - "0.0.0.0:5432:5432"   # fleet containers reach it via 172.17.0.1:5432 (bridge gateway)
  volumes:
    - ./data/postgres:/var/lib/postgresql/data
data:
  scoped_by: sub          # per-user tables distributed on the realm subject
