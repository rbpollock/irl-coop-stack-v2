# Traefik — the TLS edge for the instance (proxy pillar).
# Terminates *.irl.coop with the wildcard cert (file provider) and routes the
# public hostnames to the app containers. Router rules come ONLY from the file
# provider: the generator emits a dynamic.yml from each app's `proxy:` section.
# The docker provider is intentionally disabled — docker-socket discovery broke
# against the Docker 29 daemon (client API 1.24 < required 1.44) and is
# redundant here anyway (routes are not docker labels).
name: traefik
pillar: proxy
type: image
image: traefik:v3.5
command:
  - --providers.file.filename=/etc/traefik/dynamic.yml
  - --entrypoints.web.address=:80
  - --entrypoints.websecure.address=:443
  - --entrypoints.web.http.redirections.entrypoint.to=websecure
  - --entrypoints.web.http.redirections.entrypoint.scheme=https
  - --api.dashboard=false
  - --log.level=INFO
ports:
  - "80:80"
  - "443:443"
volumes:
  - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
  - ./certs:/etc/traefik/certs:ro
restart: always
# certs/ (the *.irl.coop wildcard from the instance dir) live in the instance
# tree, NOT in out/ — the dev override absolutizes the mount.
dev:
  volumes:
    - ./certs:/etc/traefik/certs:ro
# Extra file-provider routes beyond the app `proxy:` sections: the apex
# hostname serves the v4 dashboard (irl-dashboard on the host's :3000).
routes:
  - hostname: ${DOMAIN}
    port: 3000
    description: apex → v4 dashboard (irl-dashboard)
