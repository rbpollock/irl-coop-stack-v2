# rag-api — the RAG retrieval API (FastAPI app.main via uvicorn): areas,
# documents, jobs + the /mcp endpoint. NOT the LangGraph chat agent — client-side
# inference replaces that layer. Reaches the shared Citus/Redis/MinIO over the
# host bridge and the embed+rerank inference server (rag-inference :8001).
name: rag-api
pillar: workflow
enabled: true
type: image
image: irlcoop/rag-api:0.1.0-1024
command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
ports:
  - "8000:8000"
restart: unless-stopped
depends_on:
  rag-migrate:
    condition: service_completed_successfully
env:
  DATABASE_URL: "postgresql://rag:${SECRET:postgres.rag}@172.17.0.1:5432/rag"
  CELERY_BROKER_URL: "redis://172.17.0.1:6379/2"
  CELERY_RESULT_BACKEND: "redis://172.17.0.1:6379/3"
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: "http://172.17.0.1:9000"
  MINIO_ACCESS_KEY: rag-s3
  MINIO_SECRET_KEY: "${SECRET:minio.rag-s3}"
  MINIO_BUCKET: rag
  MINIO_SECURE: "false"
  KEYCLOAK_URL: "https://auth.irl.coop"
  KEYCLOAK_ISSUER: "https://auth.irl.coop/realms/irl-coop"
  KEYCLOAK_JWKS_URL: "https://auth.irl.coop/realms/irl-coop/protocol/openid-connect/certs"
  # Must be the STRING-ARRAY seats claim. rag-api's verifier requires the groups
  # claim to be a list of strings and silently fails everything else; the coop
  # JWT's `groups` claim is a JSON string (kept so for oauth2-proxy's
  # --oidc-groups-claim), so the token carries the same seats as
  # `group_slugs: string[]` for this consumer. Values are coop group slugs, which
  # is what an area's group_path must be set to for group-scoped retrieval.
  KEYCLOAK_GROUPS_CLAIM: group_slugs
  COOP_JWT_ISSUER: "https://api.irl.coop"
  COOP_JWT_JWKS_URL: "https://api.irl.coop/jwks"
  EMBEDDING_PROVIDER: self-hosted
  EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
  EMBEDDING_DIMENSIONS: "1024"
  SELF_HOSTED_EMBEDDING_BASE_URL: "http://172.17.0.1:8001"
  SELF_HOSTED_EMBEDDING_API_KEY: "${SECRET:rag.inference}"
  SELF_HOSTED_EMBEDDING_TIMEOUT_SECONDS: "120"
  RERANK_PROVIDER: self-hosted
  RERANK_MODEL: BAAI/bge-reranker-v2-m3
  SELF_HOSTED_RERANK_BASE_URL: "http://172.17.0.1:8001"
  SELF_HOSTED_RERANK_API_KEY: "${SECRET:rag.inference}"
  # Rerank is ~90% of the search latency, so it is tuned by MEASUREMENT, not by
  # feel. Labelled eval, 21 items, doc-level (infra/scripts/rag-eval):
  #   rerank off ....... hit@1 47.6%  MRR 0.630   0.44s
  #   base, 16 cands ... hit@1 42.9%  MRR 0.584   2.5s   <- WORSE than no rerank
  #   v2-m3, 16 cands .. hit@1 71.4%  MRR 0.766   7.6s
  #   v2-m3, 8 cands ... hit@1 66.7%  MRR 0.746   3.7s   <- shipped
  # 8 candidates halves the latency of 16 with no measurable loss (one query
  # apart, and 8 is ahead on hit@3); breadth is untouched — the assembler still
  # returns 9-12 passages either way. Re-run before changing any of this.
  RETRIEVAL_VECTOR_TOP_K: "30"
  RETRIEVAL_FTS_TOP_K: "30"
  RETRIEVAL_MAX_CANDIDATES: "30"
  RERANK_TOP_N: "8"
  RERANK_MAX_CHARS_PER_DOC: "700"
