server {
    listen 80;
    server_name _;

    root /var/www/fusionpbx;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    client_max_body_size 80M;
    client_body_buffer_size 128k;

    location / {
        root /var/www/fusionpbx;
        index index.php;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/fusionpbx$fastcgi_script_name;
        # The edge (Traefik) terminates TLS and forwards HTTP; FusionPBX's
        # session.cookie_secure=true needs PHP to see the request as HTTPS or
        # the login cookie is never set. pbx.irl.coop is only ever reached via
        # the HTTPS edge, so mark it unconditionally.
        fastcgi_param HTTPS on;
        # Header SSO: forward the oauth2-proxy gate identity to PHP (the
        # header_sso shim is wired in via php-fpm pool config, not here).
        # oauth2-proxy in PROXY mode forwards X-Forwarded-Email (pass-user-headers,
        # default on); X-Auth-Request-Email is the auth_request-mode variant.
        # Forward both — the shim prefers the auth-request header and falls back
        # to forwarded-email.
        fastcgi_param HTTP_X_AUTH_REQUEST_EMAIL $http_x_auth_request_email;
        fastcgi_param HTTP_X_FORWARDED_EMAIL $http_x_forwarded_email;
    }

    location ~ /\. { deny all; }
}
