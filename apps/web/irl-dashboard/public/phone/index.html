        <script type="text/javascript">
            // SIP config resolution (sovereign — no FusionPBX PHP session):
            //   1. sessionStorage["irlcoop.phone.config"] set by the dashboard
            //      host (same-origin) — the normal path; the SIP secret never
            //      rides the URL or a log.
            //   2. URL query params as a standalone/debug fallback.
            var server = "";
            var sipDomain = "";
            var extension = "";
            var password = "";
            var fullname = "";
            var __phoneCfg = {};
            try {
                __phoneCfg = JSON.parse(sessionStorage.getItem("irlcoop.phone.config") || "{}");
            } catch (e) { __phoneCfg = {}; }
            var q = new URLSearchParams(window.location.search);
            server    = __phoneCfg.server    || q.get("server")    || "";
            sipDomain = __phoneCfg.domain    || q.get("domain")    || "";
            extension = __phoneCfg.extension || q.get("extension") || "";
            password  = __phoneCfg.password  || q.get("password")  || "";
            fullname  = __phoneCfg.fullname  || q.get("fullname")  || "";
            // Seed the phone's stable profile ID from the identity config. The
            // vendored phone treats a missing profileUserID as "no account yet"
            // and opens its settings screen instead of registering — so bind it
            // to our identity (Keycloak sub) before phone.js boots.
            if (__phoneCfg.profileUserID) {
                try { if (!localStorage.getItem("profileUserID")) localStorage.setItem("profileUserID", __phoneCfg.profileUserID); } catch (e) {}
            }
            const webPort = '7443';
            const webPath = '/wss';
        </script>
