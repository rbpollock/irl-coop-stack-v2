name: irl-dashboard-build
# CI disabled at the request of the steward team.
# The workflow is kept on disk for reference; re-enable by removing the
# `if: false` on the build job or restoring the `on:` triggers.
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/irl-dashboard/**"
      - "apps/web/irl-dashboard/pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/web/irl-dashboard/**"
      - "apps/web/irl-dashboard/pnpm-lock.yaml"

concurrency:
  group: dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: false  # DISABLED — CI gated on steward review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/irl-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/irl-dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (next lint targets the eslint config)
        run: pnpm exec eslint .

      - name: Build
        run: pnpm exec next build